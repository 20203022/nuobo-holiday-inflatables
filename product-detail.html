<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout::head(${seoTitle != null ? seoTitle : (product.seoTitle != null ? product.seoTitle : product.nameEn)})}"></head><body><div class="min-h-screen flex flex-col"><header th:replace="~{layout::navbar}"></header><main class="flex-1"><section class="section immersive-detail"><div class="container"><div class="detail-breadcrumb"><a href="/products">Products</a><span>/</span><a th:href="${product.category.name() == 'CHRISTMAS' ? '/category/christmas' : '/category/halloween'}" th:text="${product.category.name() == 'CHRISTMAS' ? 'Christmas' : 'Halloween'}">Category</a><span>/</span><strong th:text="${product.model}">Model</strong></div><div class="product-detail-grid"><div class="detail-gallery"><div class="detail-stage-head"><span th:text="${product.category.name() == 'CHRISTMAS' ? 'Christmas collection' : 'Halloween collection'}">Collection</span><strong th:text="${product.model}">Model</strong></div><div class="detail-main-img"><img th:if="${product.images != null && product.images.size() > 0}" th:src="${product.images[0].imagePath}" th:alt="${product.model + ' ' + product.nameEn}" id="mainImage" onclick="openImagePreview(this.src)" fetchpriority="high"><img th:if="${product.images == null || product.images.size() == 0}" src="/images/placeholder.svg" alt="" id="mainImage"></div><div class="detail-thumb-strip" th:if="${product.images != null && product.images.size() > 1}"><button type="button" th:each="img,stat : ${product.images}" class="detail-thumb" th:classappend="${stat.first} ? ' active' : ''" onclick="document.getElementById('mainImage').src=this.querySelector('img').src;document.querySelectorAll('.detail-thumb').forEach(t=>t.classList.remove('active'));this.classList.add('active')"><img th:src="${img.imagePath}" th:alt="${product.model + ' image ' + (stat.index + 1)}" loading="lazy"></button></div></div><div class="product-info-panel detail-purchase-panel"><p class="eyebrow" th:text="${product.category.name() == 'CHRISTMAS' ? 'Christmas inflatable' : 'Halloween inflatable'}">Inflatable</p><h1 class="detail-name" th:text="${product.nameEn}">Product name</h1><div class="detail-summary-row"><span><small>Model</small><strong th:text="${product.model}">Model</strong></span><span><small>Collection</small><strong th:text="${product.category.name() == 'CHRISTMAS' ? 'Christmas' : 'Halloween'}">Category</strong></span></div><div class="detail-commerce-box"><div><span class="detail-meta-label">Unit price</span><span class="detail-price-current" th:text="'$' + ${#numbers.formatDecimal(product.displayPrice, 1, 2)}">$59</span><span class="detail-price-original" th:if="${product.hasDiscount()}" th:text="'$' + ${#numbers.formatDecimal(product.originalPrice, 1, 2)}">$99</span></div></div><div class="detail-tags" th:if="${product.featureTagsEn}"><span class="feature-tag" th:each="tag : ${#strings.listSplit(product.featureTagsEn, ',')}" th:text="${tag}">Tag</span></div><div class="detail-meta"><div class="detail-meta-item" th:if="${product.sizeInfo}"><span class="detail-meta-label">Size</span><span class="detail-meta-value" th:text="${product.sizeInfo}">Standard</span></div><div class="detail-meta-item"><span class="detail-meta-label">Availability</span><span th:if="${product.stock > 10}" class="detail-stock"><span class="detail-stock-dot"></span> In stock</span><span th:if="${product.stock > 0 && product.stock <= 10}" class="detail-stock low-stock"><span class="detail-stock-dot"></span> Only <span th:text="${product.stock}">0</span> left</span><span th:if="${product.stock == 0}" class="detail-stock out-of-stock">Out of stock</span></div><div class="detail-meta-item"><span class="detail-meta-label">MOQ</span><span class="detail-meta-value">Flexible trial order</span></div><div class="detail-meta-item"><span class="detail-meta-label">Lead time</span><span class="detail-meta-value">Fast holiday dispatch</span></div></div><div class="detail-action-grid" th:if="${product.stock > 0}"><form method="post" th:action="@{/cart/add}" class="detail-cart-card"><input type="hidden" name="productId" th:value="${product.id}"><div class="detail-qty"><span class="detail-qty-label">Quantity</span><div class="detail-qty-controls"><button type="button" class="detail-qty-btn cart-qty-btn cart-qty-minus" aria-label="Decrease quantity">&minus;</button><input type="number" name="quantity" value="1" min="1" th:max="${product.stock}" class="detail-qty-input cart-qty-input"><button type="button" class="detail-qty-btn cart-qty-btn cart-qty-plus" aria-label="Increase quantity">+</button></div></div><div class="detail-action-row"><button type="button" class="bulk-inquiry-add" aria-pressed="false" th:attr="data-product-id=${product.id},data-product-model=${product.model},data-product-name=${product.nameEn},data-product-image=${product.images != null && product.images.size() > 0 ? product.images[0].imagePath : '/images/placeholder.svg'}">Add to bulk inquiry</button><button type="submit" class="btn btn-gold">Add to cart</button></div></form></div></div></div></div></section><section class="section detail-related-section" th:if="${relatedProducts != null && #lists.size(relatedProducts) > 0}"><div class="container"><div class="section-title"><p class="eyebrow">More to explore</p><h2>You may also like</h2></div><div class="product-grid"><article class="product-card" th:each="p : ${relatedProducts}"><a th:href="@{/product/{id}(id=${p.id})}" class="card-img-link"><img class="card-img" th:src="${p.images != null && p.images.size() > 0} ? ${p.images[0].imagePath} : '/images/placeholder.svg'" th:alt="${p.model + ' ' + p.nameEn}" loading="lazy"></a><div class="card-body"><a class="card-title" th:href="@{/product/{id}(id=${p.id})}" th:text="${p.nameEn}">Product name</a><div class="card-price"><span th:text="'$' + ${#numbers.formatDecimal(p.displayPrice, 1, 2)}">$59</span></div></div></article></div></div></section></main><footer th:replace="~{layout::footer}"></footer></div><div class="image-preview-modal" id="imagePreviewModal" onclick="closeImagePreview(event)"><button type="button" class="image-preview-close" onclick="closeImagePreview(event)" aria-label="Close image preview">x</button><img id="imagePreviewTarget" alt=""></div><script type="application/ld+json" th:inline="javascript">{"@context":"https://schema.org","@type":"Product","name":[[${product.nameEn}]],"sku":[[${product.model}]],"description":[[${seoDescription}]],"brand":{"@type":"Brand","name":"nuobo"},"image":[[${seoImage}]],"offers":{"@type":"Offer","priceCurrency":"USD","price":[[${#numbers.formatDecimal(product.displayPrice, 1, 2)}]],"availability":[[${product.stock > 0 ? 'https://schema.org/InStock' : 'https://schema.org/OutOfStock'}]],"url":[[${'https://nuobo.store/product/' + product.id}]]}}</script></body></html>
