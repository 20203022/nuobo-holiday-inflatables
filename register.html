<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head th:replace="layout::head('Create Wholesale Account | Nuobo')"></head><body class="auth-page"><section class="auth-visual"><div class="auth-visual-content"><p class="eyebrow">Wholesale account</p><h1>Start planning your next holiday collection.</h1><p>Create an account to manage your cart and keep wholesale conversations organized.</p></div></section><section class="auth-panel"><div class="auth-card"><div class="auth-header"><a href="/"><img src="/images/logo.svg" alt="Nuobo" width="132" height="42"></a><p class="eyebrow">Create account</p><h1 th:text="#{auth.createAccount}">Create account</h1><p>Save your details for faster ordering.</p></div><div th:if="${error}" th:text="${error}" class="alert alert-error"></div><form method="post" th:action="@{/register}"><div class="form-group"><label class="form-label" for="regName">Name or company</label><input type="text" id="regName" name="name" required maxlength="200" class="input" placeholder="Your name or company" autocomplete="organization"></div><div class="form-group"><label class="form-label" for="regEmail">Business email</label><input type="email" name="email" id="regEmail" required maxlength="254" class="input" placeholder="business@email.com" autocomplete="email"></div><div class="form-group"><label class="form-label" for="regPassword">Password</label><input type="password" name="password" id="regPassword" required minlength="8" maxlength="64" class="input" placeholder="8 to 64 characters" autocomplete="new-password"></div><button type="submit" class="btn btn-gold w-full">Create account</button></form><p class="auth-footer">Already have an account? <a href="/login">Log in</a></p><p class="auth-footer"><a href="/">&larr; Back to catalog</a></p></div></section></body></html>
