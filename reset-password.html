<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head th:replace="layout::head('Set New Account Password | Nuobo')"></head><body class="auth-page"><section class="auth-visual"><div class="auth-visual-content"><p class="eyebrow">Wholesale account</p><h1>A simpler way back to sourcing.</h1><p>Set a new password and continue building your holiday product list.</p></div></section><section class="auth-panel"><div class="auth-card"><div class="auth-header"><a href="/"><img src="/images/logo.svg" alt="Nuobo" width="132" height="42"></a><p class="eyebrow">Account access</p><h1>Set new password</h1><p>Use at least 8 characters.</p></div><div th:if="${error}" class="alert alert-error" th:text="${error}"></div><form method="post" th:action="@{/reset-password}"><input type="hidden" name="token" th:value="${token}"><div class="form-group"><label class="form-label" for="newPassword">New password</label><input type="password" id="newPassword" name="password" required minlength="8" maxlength="64" class="input" autocomplete="new-password"></div><button type="submit" class="btn btn-gold w-full">Reset password</button></form></div></section></body></html>
